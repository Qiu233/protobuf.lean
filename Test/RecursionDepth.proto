syntax = "proto3";

package test.recursion_depth;

message Node {
  Node singular = 1;
  repeated Node repeated = 2;
  map<string, Node> mapped = 3;

  oneof choice {
    Node oneof_node = 4;
    int32 scalar = 5;
  }

  bytes opaque = 6;
}

message MutualA {
  MutualB next = 1;
}

message MutualB {
  MutualA next = 1;
}
